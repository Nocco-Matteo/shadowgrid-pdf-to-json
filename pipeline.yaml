# pipeline.yaml — configurazione della pipeline.
#
# Precedenza (dalla più forte): argomento esplicito > variabile d'ambiente
# PIPELINE_* > .env > questo file > default in config.py.
# Per usare un altro file: PIPELINE_CONFIG=/percorso/altra.yaml
#
# Nota: tutto gira dentro WSL2 (vLLM non supporta Windows nativo).

# --- Modelli (ID HuggingFace, o nome servito dal server vLLM) ---
model_a: "PaddlePaddle/PaddleOCR-VL-1.6"     # OCR primario, ~3GB VRAM
model_b: "deepseek-ai/DeepSeek-OCR-2"        # OCR secondario, ~4GB VRAM
extractor_model: "nicosuter/Qwen3.8-27B-AWQ" # estrattore, ~18GB VRAM + KV

# --- Schema di estrazione ---
# race_traits -> seeds/raceTraits.json del compendium (schema/compendium.schema.json)
# contract    -> contratto di esempio (usato dallo smoke test)
schema_name: "race_traits"
# Codici del libro per l'export (anche con --source); es. ["players_handbook"]
# source_codes: []

# --- Endpoint server vLLM (uno alla volta, fasi in serie) ---
vllm_url: "http://127.0.0.1:8080/v1"
ocr_a_url: "http://127.0.0.1:8080/v1"
ocr_b_url: "http://127.0.0.1:8080/v1"
extractor_url: "http://127.0.0.1:8080/v1"

# --- Storage ---
# db_path: "runs/pipeline.db"
# work_dir: "runs/work"

# --- Rasterizzazione ---
# dpi: 300
# dpi_degraded: 400
# deskew_min_angle: 0.3

# --- OCR / riconciliazione ---
# iou_align_threshold: 0.5
# text_conflict_threshold: 0.95
# conflict_margin_px: 10
# conflict_upscale: 2
# conflict_rate_warn: 0.05

# --- Server vLLM dell'estrattore (limiti VRAM, RTX 4090 24GB in WSL) ---
# Contesto massimo (prompt + risposta). Governa anche la CONCORRENZA reale:
# vLLM prenota max_model_len token di cache KV per richiesta, quindi le
# richieste simultanee sono cache_KV / max_model_len. Con i pesi AWQ da 18,8 GB
# restano 2,6 GiB di cache = 36.864 token, cioe` 2,25 richieste a 16384 e 4,5 a
# 8192 — misurato, non stimato: vLLM lo scrive all'avvio ("Maximum concurrency
# for N tokens per request"). Finestre piu` piccole ma piu` numerose: i token
# decodificati totali non cambiano, e il decode e` cio` che domina.
extractor_max_model_len: 8192
# extractor_max_num_batched_tokens: 2048  # picco attivazioni in prefill
# extractor_gpu_memory_utilization: 0.93  # > ~0.935 in WSL: vLLM non parte
# extractor_enforce_eager: true           # niente CUDA graph (più VRAM per la KV)
# extractor_text_only: true               # niente encoder visivo (~0.8GB + profiling)
# extractor_max_num_seqs: 8               # richieste parallele max
# Backend per l'output vincolato. Il default 'auto' sceglieva un percorso che
# compila lo schema JSON in una ESPRESSIONE REGOLARE, e con la tassonomia
# featureEffect (25 kind) la compilazione sfora il timeout di 5s: 161 richieste
# fallite e il motore morto (EngineDeadError) alla prima estrazione delle
# capacita' di classe. xgrammar costruisce l'automa dallo schema senza passare
# da una regex.
extractor_vllm_args: ["--structured-outputs-config.backend", "xgrammar"]

# --- Estrazione ---
# Token massimi di risposta. 2048 tronca l'inventario della Fase 4 sui
# capitoli densi: l'enumerazione delle capacita' del Chierico e' uscita
# tagliata a meta` di un region_ids e la finestra e' andata persa. Il
# budget di una finestra e` max_model_len - questo - 1024, quindi
# alzarlo accorcia anche le finestre: meno elementi per risposta.
extractor_max_tokens: 3072
# enumerate_window_tokens: null    # Fase 4: token per finestra (null = automatico dal contesto)
# extractor_temperature: 0.0
# extractor_seed: 12345
# max_fields_per_task: 8

# --- Validazione ---
# grounding_threshold: 90
# max_retries: 2

# --- Run ---
# git_sha: "unknown"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowgrid-pdf-to-json"
version = "0.1.0"
description = "Pipeline di estrazione strutturata da scansioni PDF -> JSON nidificato con citazione verificabile"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
ocr = [
  "pymupdf>=1.24",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10.2",
]
vllm = [
  "vllm>=0.5",
  "paddleocr>=2.7",
  "paddlepaddle>=2.6",
]
ui = [
  "gradio>=4.20",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

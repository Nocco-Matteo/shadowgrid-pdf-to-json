[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowgrid-pdf-to-json"
version = "0.1.0"
description = "Pipeline di estrazione strutturata da scansioni PDF -> JSON nidificato con citazione verificabile"
requires-python = ">=3.11"
readme = "README.md"
# Le dipendenze vivono in requirements.txt (unica sorgente di verità).
# pyproject.toml contiene solo metadati di build e config degli strumenti.

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
